stages:
  ingest:
    cmd: python src/ingestion/load_data.py
    deps:
      - src/ingestion/load_data.py
      - data/raw/train_transaction.csv
      - data/raw/train_identity.csv
    outs:
      - data/processed/clean.csv

  train:
    cmd: python src/training/train.py
    deps:
      - src/training/train.py
      - data/processed/clean.csv
    metrics:
      - metrics.json:
          cache: false